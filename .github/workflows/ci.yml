name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with test/docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[serve,test,docs]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check CLI tree
        run: |
          chatevent --tree
          chatevent --tree-brief
      - name: Build documentation
        run: mkdocs build --strict
