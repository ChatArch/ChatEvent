name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          ref = os.environ.get("GITHUB_REF_NAME", "")
          if not ref.startswith("v"):
              raise SystemExit(f"release tag must start with v: {ref}")
          expected = "v" + tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if ref != expected:
              raise SystemExit(f"tag {ref} does not match package version {expected}")
          PY
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
