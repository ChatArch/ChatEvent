[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatevent"
version = "0.1.3"
authors = [
    {name = "Rex Wang", email = "1073853456@qq.com"},
]
description = "Normalized events and async capture interfaces for collaboration platforms"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["agent", "event", "webhook", "zulip", "discourse", "gitea"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["httpx>=0.27", "pytest>=8"]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocs-static-i18n>=1.2,<2.0",
    "mike>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatEvent"
Documentation = "https://arch.gh.wzhecnu.cn/ChatEvent/"
Source = "https://github.com/ChatArch/ChatEvent"
Issues = "https://github.com/ChatArch/ChatEvent/issues"

[project.scripts]
chatevent = "chatevent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatevent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
